project-excludes = [
    # A symlink to a unit file that only exists on a deployed system.
    # Pyrefly refuses to walk the tree at all when it meets this.
    "confluent_osdeploy/coreos/initramfs/etc/systemd/system/initrd-root-fs.target.requires/confluent-rootfs.service",
]

# project-includes only picks the files to check. Imports are resolved against
# search-path, and without these roots pyrefly cannot tell that, for instance,
# aiohmi.util.webclient.request is async, and a large share of the findings,
# among them everything in the SMM discovery handler, goes unreported. The two
# trees both hold a package named confluent but share no module names, so one
# search path for each works; that would need revisiting if they ever overlap.
search-path = [
    "confluent_server",
    "confluent_client",
]

# The oldest interpreter parts of this tree still run on (el8, sles15).
python-version = "3.6"

preset = "off"
# Both of these are load bearing rather than decoration. With unannotated
# bodies unchecked the check reports nothing at all, since almost nothing here
# is annotated, and without inferred return types it misses a good part of the
# rest.
check-unannotated-defs = true
infer-return-types = "checked"

[errors]
unused-coroutine = "error"
not-async = "error"

parse-error = "error"              # unparseable code, from a broken file to a duplicated keyword argument
invalid-syntax = "error"           # syntax newer than python-version above
internal-error = "error"           # pyrefly itself failing on a file, otherwise silent
unused-ignore = "error"            # a `# pyrefly: ignore` whose finding is gone
bad-unpacking = "error"            # wrong count in a tuple unpack
incompatible-comparison = "error"  # comparisons that are always False, e.g. str against bytes
division-by-zero = "error"
invalid-yield = "error"            # yield where the enclosing scope cannot take one
invalid-super-call = "error"       # super() with a class that is not in the MRO
read-only = "error"                # assignment to a property with no setter
bad-dunder-all = "error"           # a name in __all__ that the module does not define
unresolvable-dunder-all = "error"  # an __all__ that is not a static list of names
bad-instantiation = "error"        # instantiating a class with abstract methods left over
implicit-abstract-class = "error"  # a subclass that silently stayed abstract
invalid-abstract-method = "error"  # @abstractmethod on a class that is not abstract
